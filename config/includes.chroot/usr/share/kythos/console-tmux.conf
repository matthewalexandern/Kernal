# A private single-pane viewport, started only after local console login.
# The outer console owns the status row; shell applications own the pane below.
set-option -g status on
set-option -g @kythos_console_managed 1
set-option -g @kythos_raw 0
set-option -g status-position top
# Neutral foreground by default. kythos-theme can update this private bar.
set-option -g status-style 'fg=white,bg=black'
set-option -g status-interval 0
set-option -g status-left ''
set-option -g status-right ''
set-option -g status-format[0] '#{?KYTHOS_CONSOLE_BRAND,#{KYTHOS_CONSOLE_BRAND},KythOS Kernal[TM] 2027} | https://kythos.ai #{client_tty}'
set-option -g prefix None
set-option -g prefix2 None
unbind-key -a -T root
unbind-key -a -T prefix
# Output scrollback is separate from Readline's ordinary Up/Down history.
# Shift+PageUp enters tmux's private scrollback; q/Esc return to the shell.
set-option -g history-limit 20000
bind-key -T root S-PPage copy-mode -u
bind-key -T copy-mode q send-keys -X cancel
bind-key -T copy-mode Escape send-keys -X cancel
bind-key -T copy-mode-vi q send-keys -X cancel
bind-key -T copy-mode-vi Escape send-keys -X cancel
set-option -g mouse off
set-option -g default-terminal tmux-256color
set-option -g default-shell /bin/bash
set-option -g allow-passthrough off
set-option -g set-titles off
set-window-option -g allow-rename off
set-window-option -g automatic-rename off
set-window-option -g pane-border-status off
set-option -s exit-empty on
set-option -s escape-time 10
