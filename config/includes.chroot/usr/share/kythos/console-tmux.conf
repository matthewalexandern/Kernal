# A private single-pane viewport, started only after local console login.
# The outer console owns the status row; shell applications own the pane below.
set-option -g status on
set-option -g @kythos_console_managed 1
set-option -g @kythos_raw 0
set-option -g status-position top
# Normal blue is themed per VT, without bold or a bright-foreground attribute.
# This also works with 512-glyph console fonts, which have only 8 text colors.
set-option -g status-style 'fg=blue,bg=black'
set-option -g status-interval 0
set-option -g status-left ''
set-option -g status-right ''
set-option -g status-format[0] 'KythOS Kernal 2027 | https://kythos.ai #{b:client_tty}'
set-option -g prefix None
set-option -g prefix2 None
unbind-key -a -T root
unbind-key -a -T prefix
set-option -g mouse off
set-option -g default-terminal tmux-256color
set-option -g default-shell /bin/bash
set-option -g allow-passthrough off
set-option -g set-titles off
set-window-option -g allow-rename off
set-window-option -g automatic-rename off
set-window-option -g pane-border-status off
set-option -s exit-empty on
set-option -s escape-time 10
