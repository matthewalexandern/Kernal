[Unit]
# Do not create or serve reusable host keys in the live environment. Installed
# systems have no /run/live/medium and generate their own keys on first boot.
ConditionPathExists=!/run/live/medium
ConditionPathExists=!/run/live/overlay

[Service]
# The build image contains no host private keys. Generate any missing key on
# the installed machine before validating the daemon configuration.
ExecStartPre=
ExecStartPre=/usr/bin/ssh-keygen -A
ExecStartPre=/usr/sbin/sshd -t
