# KythOS Kernal common-base installer. Uses the packaged Calamares modules.
---
modules-search: [ /usr/lib/kythos/calamares/modules, local, /etc/calamares/modules ]
branding: kythos
oem-setup: false
dont-chroot: false
prompt-install: true
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
sequence:
  - show:
      - welcome
      - notesqml
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      # This gate runs before the native partition job can touch a disk.
      - kythos-preflight
      - partition
      - kythos-storage
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - networkcfg
      - hwclock
      - kythos-target
      - grubcfg
      - plymouthcfg
      - initramfs
      - bootloader
      - kythos-verify
      - umount
  - show:
      - finished
