---
efiBootLoader: grub
efiBootloaderId: kythos
# Debian's grub-install installs its packaged signed shim and GRUB itself.
# The wrapper rejects unexpected options and enforces the signed EFI path.
grubInstall: /usr/local/libexec/kythos-calamares-grub-install
grubMkconfig: /usr/sbin/grub-mkconfig
grubCfg: /boot/grub/grub.cfg
grubProbe: /usr/sbin/grub-probe
efiBootMgr: /usr/sbin/efibootmgr
# Do not let upstream Calamares overwrite BOOTX64.EFI with GRUB directly;
# the Debian --force-extra-removable implementation installs shim there.
installEFIFallback: false
