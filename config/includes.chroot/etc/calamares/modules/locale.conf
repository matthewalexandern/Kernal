---
# This supported timezone stays at UTC throughout the year. All native zones
# remain selectable; no network location service is contacted.
region: Atlantic
zone: Reykjavik
# The live system uses Etc/UTC, which the native zone.tab model cannot select.
# Keep the supported UTC default rather than falling back to New York.
useSystemTimezone: false
adjustLiveTimezone: false
localeGenPath: /etc/locale.gen
geoip:
  style: none
  url: ""
  selector: ""
