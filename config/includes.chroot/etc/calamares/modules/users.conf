---
# Debian's sudo package already configures the sudo group.
defaultGroups:
  - name: sudo
    must_exist: true
    system: true
  - name: adm
    must_exist: true
    system: true
sudoersGroup: ""
autologinGroup: ""
setRootPassword: false
doAutologin: false
allowWeakPasswords: false
passwordRequirements:
  minLength: 1
  maxLength: -1
user:
  shell: /bin/bash
  home_permissions: "o700"
  forbidden_names: [ root, nobody, kythos-live ]
hostname:
  location: EtcFile
  writeHostsFile: true
  template: kythos
  forbidden_names: [ localhost ]
allowActiveDirectory: false
