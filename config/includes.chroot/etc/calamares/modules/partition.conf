# Native guided and manual partitioning remain available. The sizes below
# describe the guided layout; manual partitioning controls its own sizes.
---
efi:
  mountPoint: /boot/efi
  recommendedSize: 512MiB
  minimumSize: 300MiB
  label: KYTHOS_EFI
initialPartitioningChoice: none
allowManualPartitioning: true
userSwapChoices: [ file, none, small, suspend ]
initialSwapChoice: none
defaultFileSystemType: ext4
availableFileSystemTypes: [ ext4, btrfs, xfs ]
enableLuksAutomatedPartitioning: true
preCheckEncryption: false
luksGeneration: luks2
# Native page validation and the installation notes explain the required
# public boot filesystem. The stock warning recommends encrypting /boot,
# which conflicts with the supported signed GRUB chain.
showNotEncryptedBootMessage: false
drawNestedPartitions: true
alwaysShowPartitionLabels: true
essentialMounts: [ live-*, control, ventoy ]
lvm:
  enable: true
partitionLayout:
  # GRUB reads only this public boot partition. Root and the swap file can
  # use normal LUKS2/Argon2 without teaching GRUB an encryption password.
  - name: KYTHOS_BOOT
    filesystem: ext4
    noEncrypt: true
    mountPoint: /boot
    size: 2G
    minSize: 1G
  - name: KYTHOS_ROOT
    filesystem: unknown
    noEncrypt: false
    mountPoint: /
    size: 100%
    minSize: 12G
