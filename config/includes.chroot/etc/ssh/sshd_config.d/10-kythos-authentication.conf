# KythOS permits ordinary user passwords and public keys over SSH.
PasswordAuthentication yes
PubkeyAuthentication yes
KbdInteractiveAuthentication no
UsePAM yes
# Keep the upstream SSH protocol/version while omitting the distribution suffix.
DebianBanner no

# Root and empty-password logins are never accepted.
PermitRootLogin no
PermitEmptyPasswords no
PermitUserEnvironment no

# RSA user keys use rsa-sha2-256/512; never restore SHA-1 ssh-rsa signatures.
PubkeyAcceptedAlgorithms -ssh-rsa
HostKeyAlgorithms -ssh-rsa
