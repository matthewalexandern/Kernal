#!/usr/sbin/nft -f

# Replace only the KythOS-owned table. Container and hypervisor tools retain
# their own nftables tables when this service reloads.
destroy table inet kythos_filter

table inet kythos_filter {
    chain input {
        type filter hook input priority filter; policy drop;

        iifname "lo" accept
        ct state invalid drop
        ct state established,related accept

        # ICMP and ICMPv6 are required for diagnostics, path MTU discovery,
        # IPv6 neighbor discovery, and correct dual-stack networking.
        meta l4proto { icmp, ipv6-icmp } accept

        # Permit DHCP replies before connection tracking has an address.
        udp sport 67 udp dport 68 accept
        udp sport 547 udp dport 546 accept

        # Common SSH access plus edition/administrator inbound service rules.
        include "nftables.d/kythos-input.nft"

        counter reject with icmpx type port-unreachable
    }

    # Routing is disabled by the kernel default. Forwarding stays compatible
    # with bridges and VM/container networks; role editions own those rules.
    chain forward {
        type filter hook forward priority filter; policy accept;
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
