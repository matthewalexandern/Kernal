# Offer a valid, editable product hostname; network-provided names still work.
d-i netcfg/get_hostname string kythos
d-i netcfg/get_hostname seen false

# KythOS requires an unprivileged administrator account and keeps root locked.
d-i passwd/root-login boolean false
d-i passwd/root-password-crypted password !
d-i passwd/make-user boolean true

# Accept the user's chosen nonempty password without an installer strength rule.
# user-setup still rejects an empty password.
d-i user-setup/allow-password-weak boolean true
